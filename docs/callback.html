<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Strava Redirect</title>
    <script>
        // Extract ?code=xxx from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (code) {
            // Relay it back to your app (via custom scheme)
            window.location.href = "myapp://callback?code=" + code;
        } else {
            document.body.innerText = "No code found.";
        }
    </script>
</head>
<body>
    Redirecting back to the app...
</body>
</html>
