<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      text-align: center;
      color: #333;
    }
    h1 {
      color: #222;
    }
    p {
      margin: 1em 0;
    }
    a.button {
      display: inline-block;
      margin: 1em;
      padding: 12px 24px;
      border-radius: 6px;
      background-color: #d35400;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background-color: #e67e22;
    }
    footer {
      margin-top: 3em;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Basic Landing Page</h1>
</body>
</html>
